          - "OBC-Prune: outcome-based calibration for one-shot pruning of large reasoning models, using interventional causal scoring of chain-of-thought sentences to reweight SparseGPT, Wanda, and ALPS calibration. Improves accuracy on MATH500, LiveCodeBench, and AIME 2025."
          - "Latent Abstraction for RAG (NeurIPS 2026): retrieval performed entirely in the LLM's latent space via a [PRED] token and an adaptive Retrieval Control Head. SOTA on HotpotQA, 2WikiMQA, and MuSiQue with ~30× fewer generated tokens than text-based iterative RAG."
          - "SurveyG (ICML 2026 AI4Science Workshop): multi-agent survey generation over a hierarchical citation graph; Citation Recall 91.40 vs. 88.34 for SurveyForge."

